[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbed-console"
version = "0.1.0"
description = "Testbed Console & Dashboard — a web console for the BMW Lab O-RAN testbed"
requires-python = ">=3.12"

# Loose ranges here are the contract. requirements.txt holds the exact pins
# that reproduce a known-good install, each annotated with the reason it exists.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
e2e = ["playwright>=1.44"]

[tool.setuptools]
packages = [
    "console",
    "console.pages",
    "console.rapps",
    "console.rapps.ethos",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
